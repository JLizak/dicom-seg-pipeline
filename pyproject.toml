[project]
name = "dcmseg"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
	"pydicom",
	"numpy",
	"requests",
	"pyyaml",
]

[project.optional-dependencies]
# Trening i inferencja. Na laptopie instaluj torch w wersji CPU (patrz README).
train = [
	"torch",
	"monai>=1.4",
	"nibabel",
	"einops",       # wymagane przez SwinUNETR
	"tqdm",
]
# Eksport wyników jako DICOM-SEG / DICOM-SR (Faza 3 i 5).
dicom = [
	"highdicom",
]
dev = [
	"pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
