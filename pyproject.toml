[project]
name = "dcmseg"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
	"pydicom",
	"numpy",
	"requests",
	"pyyaml",
]

[project.optional-dependencies]
train = [
	"torch",
	"monai>=1.4",
	"nibabel",
	"tqdm",
	"timm",
]

dicom = [
	"highdicom",
]

dev = [
	"pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
